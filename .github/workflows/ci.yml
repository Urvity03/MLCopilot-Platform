name: MLCopilot CI/CD Quality Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend Unit Tests & Lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: mlcopilot
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: mlcopilot_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv & Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv
          cd apps/api
          python -m uv sync --group dev

      - name: Run Backend Pytest Suite
        env:
          POSTGRES_USER: mlcopilot
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: mlcopilot_test_db
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          DATABASE_URL: postgresql+asyncpg://mlcopilot:test_password@localhost:5432/mlcopilot_test_db
          JWT_SECRET_KEY: ci_test_secret_key_minimum_64_characters_length_for_valid_security_assurance_hash
          ENVIRONMENT: test
        run: |
          cd apps/api
          python -m uv run pytest tests/ -o asyncio_mode=auto -v --tb=short

  frontend-check:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '9.15.0'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: 'apps/web/pnpm-lock.yaml'

      - name: Install Frontend Dependencies
        run: |
          cd apps/web
          pnpm install --frozen-lockfile

      - name: Build Next.js Web App
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
        run: |
          cd apps/web
          pnpm build

  docker-build:
    name: Verify Docker Container Builds
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-check]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/api
          file: ./apps/api/Dockerfile
          push: false
          tags: mlcopilot-api:ci

      - name: Build Web Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/web
          file: ./apps/web/Dockerfile
          push: false
          tags: mlcopilot-web:ci
